<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPO Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/styles.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="icon" href="/static/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>

<body>
  <div class="shell">
    <header class="masthead">
      <span class="wordmark">IPO Desk</span>
      <span class="eyebrow">Grey market &amp; deadlines</span>
      <div class="segs" role="group" aria-label="IPO type">
        <button class="seg" data-type="mainboard" aria-pressed="true">Mainboard</button>
        <button class="seg" data-type="sme" aria-pressed="false">SME</button>
        <button class="seg" data-type="all" aria-pressed="false">All</button>
      </div>
      <span class="live"><span class="pip"></span><span id="live-count">loading</span></span>
    </header>

    <div class="body">
      <aside class="rail" id="rail" aria-label="Open IPOs">
        <div class="rail-head"><span>Open now</span><span id="rail-date"></span></div>
        <div id="rail-list">
          <div class="rail-empty">Reading the register…</div>
        </div>
      </aside>

      <main class="convo">
        <div class="scroll" id="scroll">
          <div class="thread" id="thread">
            <div class="opening" id="opening">
              <h1>Which IPOs are open, and <em>by when</em> must you apply?</h1>
              <p>Ask in plain language. Answers come from InvestorGain's live register, never from memory.</p>
              <div class="chips">
                <button class="chip" data-q="What IPOs are open right now?">What's open now</button>
                <button class="chip" data-q="Is anything closing today or tomorrow?">Closing soon</button>
                <button class="chip" data-q="Which IPOs are opening in the next two weeks?">Opening next</button>
                <button class="chip" data-q="Which IPOs closed in the last week?">Recently closed</button>
                <button class="chip"
                  data-q="Provide table format details about all ongoing IPOs GMP, Estimate profit for each and Total issue size( get it from web search) in descending order of profit">Gather
                  all
                  details</button>
              </div>
            </div>
          </div>
        </div>

        <div class="composer">
          <div class="composer-inner">
            <textarea id="input" rows="1" placeholder="Ask about deadlines, open issues, a company by name…"
              aria-label="Your question"></textarea>
            <button class="send" id="send">Ask</button>
          </div>
          <div class="hint-row">
            <span class="hint">Enter to send · Shift+Enter for a new line</span>
            <button class="clear" id="clear" type="button">Clear</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>

</html>
